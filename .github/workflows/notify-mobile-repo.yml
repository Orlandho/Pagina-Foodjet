# Flujo de sincronización y notificación hacia la app móvil (Orlandho/proyecto-app-movil-UPN-2026-2)
name: Notificar al Repositorio Móvil

on:
  push:
    branches:
      - main

jobs:
  dispatch:
    name: Enviar evento repository_dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Notificar al repositorio móvil
        env:
          PAT_CROSS_REPO: ${{ secrets.PAT_CROSS_REPO }}
        run: |
          if [ -z "$PAT_CROSS_REPO" ]; then
            echo "::error::El secreto PAT_CROSS_REPO no está configurado o está vacío en los secretos del repositorio (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl -L \
            --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT_CROSS_REPO" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Orlandho/proyecto-app-movil-UPN-2026-2/dispatches \
            -d '{
              "event_type": "foodjet-updated",
              "client_payload": {
                "commit_sha": "${{ github.sha }}",
                "sha": "${{ github.sha }}",
                "author": "${{ github.actor }}",
                "ref": "${{ github.ref }}",
                "branch": "${{ github.ref_name }}"
              }
            }'
